name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: tape_en_cours/demo_api
        run: |
          pip install -r requirements.txt

      - name: Generate Documentation
        working-directory: tape_en_cours/demo_api
        run: |
          python scripts/generate_docs.py

      - name: Prepare for GitHub Pages
        working-directory: tape_en_cours/demo_api
        run: |
          # Créer le dossier de déploiement à la racine du repo
          mkdir -p ../../docs-deploy
          cp -r docs/sphinx/build/* ../../docs-deploy/
          mkdir -p ../../docs-deploy/pdoc3
          cp -r docs/pdoc3/* ../../docs-deploy/pdoc3/
          # Ajouter fichier .nojekyll pour GitHub Pages
          touch ../../docs-deploy/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs-deploy
